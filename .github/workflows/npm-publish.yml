# Publish @nwlnexus/mnemosyne to the public npm registry — the "Foundation
# layer" for native (non-nix) installation (mnemosyne#27). Triggered by
# pushing a `v*` tag (e.g. `v0.1.0`); the repo has no semantic-release /
# release-please / changesets config, so this is a plain tag-triggered
# publish rather than a fully automated release train.
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN, nothing to expire or
# rotate. https://docs.npmjs.com/trusted-publishers
#
# IMPORTANT — sequencing, do not merge this out of order:
# Trusted Publisher configuration lives on the package's OWN settings page
# on npmjs.com (npmjs.com/package/@nwlnexus/mnemosyne/access), which does
# not exist until the package has been published at least once. This repo's
# very first publish MUST happen with the prior token-based version of this
# workflow (NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}); only after that
# bootstrap publish succeeds can a Trusted Publisher be registered for
# GitHub Actions (org: nwlnexus, repo: mnemosyne, workflow filename:
# npm-publish.yml, allowed action: npm publish). Only merge this branch
# once that registration is done — until then it will fail every publish
# attempt (no token fallback, and OIDC has nothing to authenticate against).
# Once merged and verified working, revoke/delete the NPM_TOKEN secret —
# it's no longer used anywhere in this workflow.
name: npm-publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Required for OIDC (npm Trusted Publishing token exchange) AND for
      # provenance attestation — same permission covers both.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # No explicit `version:` — action-setup reads it from the
      # `packageManager` field in package.json (pnpm@11.9.0). Passing both
      # throws "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify tag matches package.json version
        # Only meaningful for the tag-push trigger; a workflow_dispatch run
        # (GITHUB_REF_NAME is a branch name in that case) skips this check.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (version $tag_version) does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Ensure npm supports Trusted Publishing (>= 11.5.1)
        # Node 24's bundled npm should already clear this, but pin explicitly
        # rather than assume — trusted publishing silently isn't attempted on
        # older npm, which would otherwise fail confusingly at the publish
        # step with no OIDC and no token.
        run: npm install -g npm@latest

      - name: Publish to npm
        # No NODE_AUTH_TOKEN — npm CLI exchanges the workflow's OIDC identity
        # (id-token: write, above) for a short-lived publish credential via
        # the Trusted Publisher registered on npmjs.com. --provenance kept
        # explicitly: reports of it not always kicking in automatically on
        # the first trusted-publish attempt even though npm's docs say it's
        # automatic (https://github.com/npm/cli/issues/8730).
        run: npm publish --access public --provenance
