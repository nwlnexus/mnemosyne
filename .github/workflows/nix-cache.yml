# Build the flake package and publish its signed closure to the nwlnexus R2
# nix binary cache, so consumers (nix-darwin-hm hosts) substitute a prebuilt
# binary instead of running the pnpm build locally on every darwin-rebuild.
#
# Secrets come from 1Password (org secret store) via the org-wide
# OP_SERVICE_ACCOUNT_TOKEN GitHub secret. The service account must be able to
# read the Dev vault. Fields on op://Dev/nwlnexus-nix-cache:
#   account-id          Cloudflare account id (personal/nwlnexus account)
#   access-key-id       R2 S3 API token (Object Read & Write on the
#   secret-access-key   nwlnexus-nix-cache bucket)
#   nix-signing-key     nix cache signing key, one line
#                       ("nix-cache.nwlnexus.io-1:<base64>"); its public pair
#                       is in nix-darwin-hm's extra-trusted-public-keys
name: nix-cache

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macos-15 runners are aarch64-darwin — the system every consumer host
    # runs. Add an ubuntu-24.04-arm entry here if the nixos-arm hosts ever
    # consume mnemosyne from the cache too.
    runs-on: macos-15
    permissions:
      contents: read
    env:
      # secrets.* is not allowed in step-level `if:`; surface presence here.
      HAS_OP_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          # Determinate Nix enables the darwin seatbelt sandbox by default;
          # match local builds (upstream nix, sandbox off). The pnpm-deps FOD
          # is substituted from R2 rather than built here regardless — see
          # the Build step.
          extra-conf: |
            sandbox = false

      - name: Load secrets from 1Password
        # Fork PRs get no secrets; same-repo PRs and main pushes do. Guarded
        # so a fork PR still runs the build (it will just lack the R2
        # substituter and may trip the runner's pnpm memory kill — see below).
        if: env.HAS_OP_TOKEN == 'true'
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          R2_ACCOUNT_ID: op://Dev/nwlnexus-nix-cache/account-id
          AWS_ACCESS_KEY_ID: op://Dev/nwlnexus-nix-cache/access-key-id
          AWS_SECRET_ACCESS_KEY: op://Dev/nwlnexus-nix-cache/secret-access-key
          NIX_CACHE_SECRET_KEY: op://Dev/nwlnexus-nix-cache/nix-signing-key

      - name: Provide R2 credentials to the nix-daemon
        # Substitution runs inside the nix-daemon (root), which cannot see
        # this job's AWS_* env vars — without this it falls back to IMDS,
        # fails auth, and silently skips the R2 substituter (observed:
        # "Valid credentials could not be sourced by the IMDS provider").
        if: env.HAS_OP_TOKEN == 'true'
        run: |
          sudo mkdir -p /var/root/.aws
          umask 077
          printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" | sudo tee /var/root/.aws/credentials >/dev/null
          sudo chmod 600 /var/root/.aws/credentials

      - name: Build
        id: build
        # Substitute from the R2 cache when creds are available. This is
        # load-bearing, not just a speedup: the pnpm-deps FOD gets SIGKILLed
        # on 7GB macos-15 runners (memory), so the runner must substitute the
        # locally-seeded pnpm-deps instead of running pnpm itself. FOD output
        # paths depend only on name+hash, so locally-pushed paths match.
        run: |
          opts=()
          if [ -n "${R2_ACCOUNT_ID:-}" ]; then
            opts+=(
              --option extra-substituters "s3://nwlnexus-nix-cache?endpoint=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com&region=auto"
              --option extra-trusted-public-keys "nix-cache.nwlnexus.io-1:ioP2I0gXFUjZyoPkhHPq2Xqi93zkgIv9VSA+BmGE5I0="
            )
          fi
          out=$(nix build .# --print-out-paths "${opts[@]}")
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Sign and push closure to R2
        # Cache pushes only from main: PR builds verify buildability without
        # publishing unreviewed artifacts.
        if: github.event_name != 'pull_request'
        env:
          OUT: ${{ steps.build.outputs.out }}
        run: |
          umask 077
          printf '%s' "$NIX_CACHE_SECRET_KEY" > /tmp/cache-key.sec
          nix store sign --key-file /tmp/cache-key.sec --recursive "$OUT"
          nix copy --to "s3://nwlnexus-nix-cache?endpoint=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com&region=auto&compression=zstd" "$OUT"
          rm -f /tmp/cache-key.sec
          echo "pushed $OUT"
