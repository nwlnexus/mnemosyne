name: Pipeline Improvement
description: Propose a CI/CD or pipeline improvement
labels: ["ci"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for CI/CD pipeline changes, build optimizations, or quality-gate improvements.

  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behavior
      description: How does the pipeline currently work?
    validations:
      required: true

  - type: textarea
    id: desired-behavior
    attributes:
      label: Desired Behavior
      description: How should it work instead?
    validations:
      required: true

  - type: checkboxes
    id: affected-gates
    attributes:
      label: Affected Quality Gates
      description: Which quality gates are affected?
      options:
        - label: build
        - label: test
        - label: typecheck
        - label: lint

  - type: textarea
    id: performance-impact
    attributes:
      label: Performance Impact
      description: Expected impact on build times, costs, or reliability
    validations:
      required: false
